<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Incursion simulation tests</title><style>body{font:15px system-ui;color:#dfebfc;background:#081322;padding:24px}li{padding:7px;border-bottom:1px solid #253b56}.pass{color:#75e3ae}.fail{color:#ff8ca0}a{color:#80d7ff}</style></head><body><h1>Incursion · simulation acceptance tests</h1><p id="summary">Running…</p><ol id="results"></ol><p><a href="../">Return to game</a></p><script type="module">import {run} from './suite.js';let rows=await run(r=>{let li=document.createElement('li');li.className=r.pass?'pass':'fail';li.textContent=(r.pass?'PASS ':'FAIL ')+r.name+' ('+r.ms.toFixed(1)+' ms) '+(r.error||'');document.querySelector('#results').append(li)});document.querySelector('#summary').textContent=rows.filter(r=>r.pass).length+'/'+rows.length+' passed';document.body.dataset.done='true';</script></body></html>
